auth_enabled: false

ingester:
  chunk_idle_period: 3m
  max_chunk_age: 5m
  max_streams_per_user: 12000
  chunk_retain_period: 1m
  line_buffer: 32KB

limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h

schema_config:
  configs:
  - from: 2020-10-24
    store: boltdb-shipper
    object_store: filesystem
    schema: v11
    index:
      prefix: index_
      period: 24h

server:
  http_listen_port: 3100

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/loki/boltdb-shipper-active
    shared_store: filesystem
    cache_location: /loki/loki/boltdb-shipper-cache
  filesystem:
    directory: /loki/chunks
