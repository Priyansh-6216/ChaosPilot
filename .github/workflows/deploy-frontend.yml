name: Deploy ChaosPilot Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend/chaos-ui
        run: npm ci

      - name: Build frontend
        working-directory: frontend/chaos-ui
        env:
          VITE_BASE_URL: '/ChaosPilot/'
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/chaos-ui/dist
          publish_branch: gh-pages
          keep_files: false
